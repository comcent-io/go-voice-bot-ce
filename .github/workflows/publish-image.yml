name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# amd64-only while this repo is private: the free ubuntu-24.04-arm runners
# only exist for public repos. Switch to the freeswitch-ce multi-arch
# digest/manifest pattern when the repo goes public.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          # :latest and version tags are only moved by the Release workflow.
          tags: |
            ghcr.io/comcent-io/go-voice-bot-ce:main
            ghcr.io/comcent-io/go-voice-bot-ce:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
